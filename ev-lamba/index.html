    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        
        .header { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; margin-bottom: 15px; border-bottom: 1px solid #333;
        }
        .header h1 { font-size: 20px; color: #4fc3f7; }
        .status { font-size: 12px; padding: 4px 10px; border-radius: 10px; }
        .status.connected { background: #2e7d32; color: #fff; }
        .status.disconnected { background: #c62828; color: #fff; }
        
        .tabs { display: flex; background: #1e1e1e; border-radius: 10px; margin-bottom: 15px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; }
        .tab.active { background: #4fc3f7; color: #000; font-weight: 600; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Cihaz Listesi */
        .device-card { 
            background: #1e1e1e; border-radius: 10px; padding: 15px; margin-bottom: 15px;
            border-left: 4px solid #4fc3f7;
        }
        .device-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .device-name { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        .device-rssi { 
            font-size: 12px; font-weight: normal; 
            padding: 2px 6px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        .device-rssi.excellent { color: #4caf50; }
        .device-rssi.good { color: #ff9800; }
        .device-rssi.poor { color: #f44336; }
        .device-meta { font-size: 11px; color: #888; }
        
        .relay-control { margin: 15px 0; }
        .relay-item { 
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 10px;
        }
        .relay-info { flex: 1; }
        .relay-name { font-size: 14px; margin-bottom: 3px; }
        .relay-status { font-size: 12px; }
        .relay-status.on { color: #4caf50; }
        .relay-status.off { color: #f44336; }
        
        /* Tekli Buton Stili (Toggle yerine) */
        .ctrl-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            min-width: 80px;
            transition: all 0.3s;
            font-size: 13px;
        }
        .ctrl-btn.btn-off { background: #2e7d32; color: white; } /* Kapalıyken 'AÇ' butonu yeşil */
        .ctrl-btn.btn-on { background: #c62828; color: white; }  /* Açıkken 'KAPAT' butonu kırmızı */
        
        .device-actions { display: flex; gap: 8px; margin-top: 15px; }
        .action-btn { 
            flex: 1; padding: 8px; border: none; border-radius: 6px;
            font-size: 13px; cursor: pointer;
        }
        .btn-edit { background: #ff9800; color: #000; }
        .btn-delete { background: #f44336; color: #fff; }
        .btn-check { background: #9c27b0; color: #fff; }
        
        /* Form Stilleri */
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        .form-input { 
            width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444;
            border-radius: 8px; color: #fff; font-size: 14px;
        }
        .form-input:focus { outline: none; border-color: #4fc3f7; }
        
        .form-submit { 
            width: 100%; padding: 14px; background: #4fc3f7; color: #000;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px;
        }
        
        /* Log Bölümü */
        .log-box { 
            background: #1e1e1e; border-radius: 10px; padding: 15px;
            height: 250px; overflow-y: auto; font-family: 'Courier New', monospace;
            font-size: 12px; line-height: 1.4;
        }
        .log-entry { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .log-time { color: #888; font-size: 11px; }
        
        /* Modal */
        .modal { 
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            z-index: 1000; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-content { 
            background: #1e1e1e; border-radius: 15px; padding: 20px;
            width: 100%; max-width: 400px;
        }
        .modal-header { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333;
        }
        .modal-title { font-size: 18px; color: #4fc3f7; }
        .modal-close { 
            background: none; border: none; color: #888; font-size: 24px;
            cursor: pointer; line-height: 1;
        }
        
        /* Alert */
        .alert { 
            padding: 12px; border-radius: 8px; margin-bottom: 15px;
            display: none;
        }
        .alert.show { display: block; animation: fadeIn 0.3s; }
        .alert.success { background: rgba(76, 175, 80, 0.2); border: 1px solid #4caf50; }
        .alert.error { background: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
            /* Ana menu (relay_webpage_multi.h ile ayni) */
        .nav { background: #1a1a1a; padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; border-bottom: 1px solid #333; }
        .nav a { color: #888; text-decoration: none; font-size: 0.9em; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .nav a.active { background: #3700b3; color: #fff; }

/* Kapaliyken TUM butonlar sonuk gri (LED sonuk hissi); anlam tonu (--t) sadece basilirken ve durum acikken (btn-on) yanar: primary/mavi=genel islem, accent/yesil=olumlu, warn/turuncu=dikkat, danger/kirmizi=tehlikeli */
.btn{color:#7d828c}
.btn-primary,.btn-mavi{--t:96,165,250}.btn-accent,.btn-yesil{--t:34,230,96}.btn-danger,.btn-kirmizi{--t:255,85,85}.btn-warn,.btn-turuncu{--t:255,190,70}
.btn:active{color:rgb(var(--t,200,205,215));text-shadow:0 0 5px rgb(var(--t,200,205,215)),0 0 12px rgba(var(--t,200,205,215),.6)}
.btn-primary,.btn-accent,.btn-danger,.btn-warn,.btn-yesil,.btn-turuncu,.btn-mavi,.btn-kirmizi{background-color:#020203}
/* Durum (acik/aktif): zemin siyah, yazi + cevre --t tonunda neon, yavasca nefes alir. Varsayilan yesil; ton-kirmizi=tehlike aktif, ton-amber=uyari durumu, ton-mavi=bilgi/bahce kapisi */
.btn.btn-on{--t:34,230,96;font-weight:800;color:rgb(var(--t));text-shadow:0 0 4px rgb(var(--t)),0 0 10px rgba(var(--t),.8),0 0 20px rgba(var(--t),.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 6px 1px rgba(var(--t),.6),0 0 22px 5px rgba(var(--t),.35);animation:btnNefes 3.6s ease-in-out infinite}
.btn.btn-on.ton-kirmizi{--t:255,85,85}.btn.btn-on.ton-amber{--t:255,190,70}.btn.btn-on.ton-mavi{--t:70,150,255}.btn.btn-on.sabit{animation:none}
@keyframes btnNefes{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 5px 1px rgba(var(--t),.45),0 0 16px 3px rgba(var(--t),.22);text-shadow:0 0 3px rgb(var(--t)),0 0 7px rgba(var(--t),.7),0 0 14px rgba(var(--t),.5)}}
@media(prefers-reduced-motion:reduce){.btn.btn-on{animation:none}}

    <script>
// Diger Projeler (ust menu) - acilir liste; disari tiklayinca kapanir
function digerAc(e) { e.preventDefault(); e.stopPropagation(); document.getElementById("digerMenu").classList.toggle("acik"); }
document.addEventListener("click", () => { const m = document.getElementById("digerMenu"); if (m) m.classList.remove("acik"); });

        let mqttClient = null;
        let devices = [];
        let rssiCache = {}; // RSSI değerlerini cache'lemek için
        
        // Ayni sayfa HUB'dan (/mqtt) ve nedu41.github.io/ev-lamba'dan servis edilir (tools/export_mqtt_page.py)
        const REMOTE = location.hostname.endsWith('github.io');
        const REMOTE_URL = 'https://nedu41.github.io/ev-lamba/';

        // Yerel / Uzak (Kalburum ile ayni dugme): https'ten (GitHub Pages) aciksa Uzak. Uzak sayfada HUB
        // menusu calismaz (HUB adresleri) -> gizlenir. Yerelden Uzak'a gecerken cihaz listesi adrese eklenir.
        const UZAK = location.protocol === 'https:';
        function modDugmesi() {
            const b = document.getElementById('modBtn');
            if (b) { b.textContent = UZAK ? 'Uzak' : 'Yerel'; b.classList.toggle('btn-on', UZAK); b.classList.toggle('ton-mavi', UZAK); }
            const n = document.querySelector('.nav');
            if (n && UZAK) n.style.display = 'none';
        }
        function modDegistir() {
            if (UZAK) { location.href = 'http://merkezihub.local/'; return; }
            const list = devices.map(d => [d.name, d.mac]);
            location.href = REMOTE_URL + '#d=' + btoa(unescape(encodeURIComponent(JSON.stringify(list))));
        }

        window.onload = function() {
            modDugmesi();
            loadDevices();
            importFromHash();
            connectMQTT();
            if (REMOTE) document.getElementById('remoteLink').style.display = 'none';
            else syncHubDevices();
        };

        // Cihaz listesi github.io sayfasina adresin # kismiyla tasinir: # sunucuya gitmez,
        // MAC'ler public depoya girmez. Evde telefondan bir kez "Dışarıda kullan"a dokunmak yeterli.
        function importFromHash() {
            if (!location.hash.startsWith('#d=')) return;
            try {
                const list = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
                let n = 0;
                list.forEach(([name, mac]) => {
                    mac = (mac || '').toLowerCase().replace(/:/g, '');
                    if (!/^[0-9a-f]{12}$/.test(mac)) return;
                    const d = devices.find(x => x.mac === mac);
                    if (d) { d.name = name; return; }
                    devices.push({ id: 'dev_' + mac, name: name, mac: mac, ip: null, relays: { r1: 'off', r2: 'off' } });
                    n++;
                });
                saveDevices();
                renderDevices();
                showAlert(list.length + ' cihaz aktarıldı (' + n + ' yeni)', 'success');
            } catch (e) {
                showAlert('Cihaz listesi okunamadı', 'error');
            }
            history.replaceState(null, '', location.pathname);
        }

        // HUB'in cihaz listesini otomatik ekle/guncelle (ayni sunucudan servis edildigi icin /get_devices erisilebilir)
        function syncHubDevices() {
            fetch('/get_devices').then(r => r.json()).then(list => {
                let changed = false;
                list.forEach(h => {
                    const mac = (h.mac || '').toLowerCase().replace(/:/g, '');
                    if (!/^[0-9a-f]{12}$/.test(mac)) return;
                    const d = devices.find(x => x.mac === mac);
                    if (d) {
                        if (d.name !== h.name || d.ip !== h.ip) { d.name = h.name; d.ip = h.ip; changed = true; }
                    } else {
                        const nd = { id: 'dev_' + mac, name: h.name, mac: mac, ip: h.ip || null, relays: { r1: 'off', r2: 'off' } };
                        devices.push(nd);
                        subscribeDevice(nd);
                        changed = true;
                    }
                });
                if (changed) { saveDevices(); renderDevices(); }
            }).catch(() => {});
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }
        
        function connectMQTT() {
            // Ozel broker (EMQX Cloud, 2026-11-02): giris portal ile ayni anahtarlarda
            let u = localStorage.getItem('uzakKullanici'), p = localStorage.getItem('uzakSifre');
            if (!u || !p) {
                u = prompt('MQTT kullanıcı adı', u || ''); if (!u) return;
                p = prompt('MQTT şifresi'); if (!p) return;
                localStorage.setItem('uzakKullanici', u); localStorage.setItem('uzakSifre', p);
            }
            mqttClient = mqtt.connect('wss://h11f4d1a.ala.eu-central-1.emqxsl.com:8084/mqtt', {
                username: u, password: p,
                clientId: 'evlamba-' + Math.random().toString(16).slice(2, 10)
            });
            
            mqttClient.on('connect', function() {
                document.getElementById('mqttStatus').textContent = 'Bağlandı';
                document.getElementById('mqttStatus').className = 'status connected';
                log('MQTT bağlandı');
                
                devices.forEach(device => {
                    subscribeDevice(device);
                });
            });
            
            mqttClient.on('message', function(topic, message) {
                const msg = message.toString();
                log(`MQTT: ${topic} = ${msg}`);
                
                // RSSI değeri kontrolü
                if (topic.includes('/status') && msg.includes('wifi_rssi')) {
                    try {
                        const data = JSON.parse(msg);
                        if (data.wifi_rssi !== undefined) {
                            updateDeviceRSSI(topic, data.wifi_rssi);
                        }
                    } catch (e) {
                        // JSON parse hatası
                    }
                }
                
                devices.forEach(device => {
                    if (device.mac && topic.includes(device.mac)) {
                        if (topic.includes('/r1/state')) {
                            device.relays.r1 = msg === '1' ? 'on' : 'off';
                        } else if (topic.includes('/r2/state')) {
                            device.relays.r2 = msg === '1' ? 'on' : 'off';
                        }
                        saveDevices();
                        renderDevices();
                    }
                });
            });
            
            mqttClient.on('error', function(err) {
                log(`MQTT hatası: ${err}`);
                if (/auth|Not authorized|Bad user/i.test(String(err))) {
                    localStorage.removeItem('uzakSifre'); mqttClient.end(true);
                    log('Giriş reddedildi - sayfayı yenileyip tekrar girin');
                }
            });
        }
        
        function subscribeDevice(device) {
            if (!device.mac || !mqttClient) return;
            
            const topics = [
                `esp01/${device.mac}/r1/state`,
                `esp01/${device.mac}/r2/state`,
                `esp01/${device.mac}/status`
            ];
            
            topics.forEach(topic => {
                mqttClient.subscribe(topic, function(err) {
                    if (!err) log(`Abone: ${topic}`);
                });
            });
        }
        
        function loadDevices() {
            const stored = localStorage.getItem('esp01_devices');
            if (stored) {
                devices = JSON.parse(stored);
                
                // Cache'den RSSI değerlerini yükle
                const rssiCacheStored = localStorage.getItem('esp01_rssi_cache');
                if (rssiCacheStored) {
                    rssiCache = JSON.parse(rssiCacheStored);
                }
                
                renderDevices();
            }
        }
        
        function saveDevices() {
            localStorage.setItem('esp01_devices', JSON.stringify(devices));
            localStorage.setItem('esp01_rssi_cache', JSON.stringify(rssiCache));
        }
        
        function renderDevices() {
            const container = document.getElementById('deviceList');
            
            if (devices.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; color: #666;">
                        <div style="font-size: 40px; margin-bottom: 10px;">🏠</div>
                        <p>Henüz cihaz eklenmemiş</p>
                        <small style="color:#666; margin-top:10px;">Yeni cihaz eklemek için ➕ butonuna tıklayın</small>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            devices.forEach(device => {
                // Bu cihaz için RSSI değerini al
                const rssi = rssiCache[device.mac] || null;
                const rssiClass = getRSSIClass(rssi);
                const rssiDisplay = rssi !== null ? `${rssi} dBm` : '-- dBm';
                
                html += `
                    <div class="device-card">
                        <div class="device-header">
                            <div>
                                <div class="device-name">${device.name}</div>
                                <span class="device-rssi ${rssiClass}">${rssiDisplay}</span>
                            </div>
                            <div class="device-meta">
                                ${device.mac}<br>
                                ${device.ip ? device.ip : ''}
                            </div>
                        </div>
                        
                        <div class="relay-control">
                            <div class="relay-item">
                                <div class="relay-info">
                                    <div class="relay-name">Röle 1</div>
                                    <div class="relay-status ${device.relays.r1 === 'on' ? 'on' : 'off'}">
                                        ${device.relays.r1 === 'on' ? 'Açık' : 'Kapalı'}
                                    </div>
                                </div>
                                <button class="ctrl-btn ${device.relays.r1 === 'on' ? 'btn-on' : 'btn-off'}" 
                                        onclick="toggleRelay('${device.id}', 'r1')">
                                    ${device.relays.r1 === 'on' ? 'KAPAT' : 'AÇ'}
                                </button>
                            </div>
                            
                            <div class="relay-item">
                                <div class="relay-info">
                                    <div class="relay-name">Röle 2</div>
                                    <div class="relay-status ${device.relays.r2 === 'on' ? 'on' : 'off'}">
                                        ${device.relays.r2 === 'on' ? 'Açık' : 'Kapalı'}
                                    </div>
                                </div>
                                <button class="ctrl-btn ${device.relays.r2 === 'on' ? 'btn-on' : 'btn-off'}" 
                                        onclick="toggleRelay('${device.id}', 'r2')">
                                    ${device.relays.r2 === 'on' ? 'KAPAT' : 'AÇ'}
                                </button>
                            </div>
                        </div>
                        
                        <div class="device-actions">
                            <button class="action-btn btn-edit" onclick="editDevice('${device.id}')">Düzenle</button>
                            <button class="action-btn btn-delete" onclick="deleteDevice('${device.id}')">Sil</button>
                            ${device.ip ? `<button class="action-btn btn-check" onclick="checkDevice('${device.id}')">Durum</button>` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function getRSSIClass(rssi) {
            if (rssi === null) return '';
            if (rssi >= -60) return 'excellent';
            if (rssi >= -70) return 'good';
            return 'poor';
        }
        
        function updateDeviceRSSI(topic, rssi) {
            // Topic'ten MAC adresini çıkar
            const match = topic.match(/esp01\/([a-f0-9]+)\/status/);
            if (match) {
                const mac = match[1];
                rssiCache[mac] = rssi;
                saveDevices();
                renderDevices();
            }
        }
        
        function addDevice() {
            const name = document.getElementById('name').value.trim();
            let mac = document.getElementById('mac').value.trim().toLowerCase();
            const ip = document.getElementById('ip').value.trim();
            
            mac = mac.replace(/:/g, '');
            if (mac.length !== 12 || !/^[0-9a-f]{12}$/.test(mac)) {
                showAlert('Geçersiz MAC adresi!', 'error');
                return false;
            }
            
            const device = {
                id: 'dev_' + Date.now(),
                name: name,
                mac: mac,
                ip: ip || null,
                relays: {
                    r1: 'off',
                    r2: 'off'
                }
            };
            
            devices.push(device);
            saveDevices();
            subscribeDevice(device);
            
            document.getElementById('addForm').reset();
            renderDevices();
            showTab('devices');
            showAlert(`${name} eklendi`, 'success');
            
            return false;
        }
        
        function toggleRelay(deviceId, relay) {
            const device = devices.find(d => d.id === deviceId);
            if (!device || !device.mac || !mqttClient) return;
            
            const currentState = device.relays[relay];
            const newState = currentState === 'on' ? '0' : '1';
            
            const topic = `esp01/${device.mac}/${relay}/set`;
            mqttClient.publish(topic, newState, { qos: 0, retain: false });
            
            log(`${device.name} - ${relay}: ${currentState === 'on' ? 'Kapandı' : 'Açıldı'}`);
            
            // Arayüzün hızlı tepki vermesi için iyimser güncelleme
            device.relays[relay] = currentState === 'on' ? 'off' : 'on';
            saveDevices();
            renderDevices();
        }
        
        async function checkDevice(deviceId) {
            const device = devices.find(d => d.id === deviceId);
            if (!device || !device.ip) return;
            
            try {
                showAlert(`${device.name} durum kontrolü...`, 'success');
                
                // HTTP isteği ile durum kontrolü
                const response = await fetch(`http://${device.ip}/status`);
                if (response.ok) {
                    const data = await response.json();
                    
                    // RSSI değerini güncelle
                    if (data.wifi_rssi !== undefined) {
                        rssiCache[device.mac] = data.wifi_rssi;
                        saveDevices();
                        renderDevices();
                    }
                    
                    showAlert(`${device.name}: RSSI ${data.wifi_rssi || '--'} dBm`, 'success');
                    log(`${device.name} RSSI: ${data.wifi_rssi || '--'} dBm`);
                }
            } catch (error) {
                showAlert(`${device.name} bağlantı hatası`, 'error');
                log(`${device.name} kontrol hatası: ${error}`);
            }
        }
        
        function editDevice(deviceId) {
            const device = devices.find(d => d.id === deviceId);
            if (!device) return;
            
            document.getElementById('editId').value = device.id;
            document.getElementById('editName').value = device.name;
            document.getElementById('editMac').value = device.mac;
            document.getElementById('editIp').value = device.ip || '';
            
            document.getElementById('editModal').style.display = 'flex';
        }
        
        function saveEdit() {
            const deviceId = document.getElementById('editId').value;
            const device = devices.find(d => d.id === deviceId);
            
            if (!device) return;
            
            if (mqttClient && device.mac) {
                const oldTopics = [
                    `esp01/${device.mac}/r1/state`,
                    `esp01/${device.mac}/r2/state`,
                    `esp01/${device.mac}/status`
                ];
                oldTopics.forEach(topic => mqttClient.unsubscribe(topic));
                
                // Eski RSSI değerini temizle
                delete rssiCache[device.mac];
            }
            
            const oldMac = device.mac;
            device.name = document.getElementById('editName').value.trim();
            device.mac = document.getElementById('editMac').value.trim().toLowerCase();
            device.ip = document.getElementById('editIp').value.trim() || null;
            
            // Eski MAC için RSSI değerini sil, yeni MAC'e taşı
            if (oldMac !== device.mac && rssiCache[oldMac]) {
                rssiCache[device.mac] = rssiCache[oldMac];
                delete rssiCache[oldMac];
            }
            
            subscribeDevice(device);
            saveDevices();
            renderDevices();
            closeModal();
            showAlert(`${device.name} güncellendi`, 'success');
        }
        
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        function deleteDevice(deviceId) {
            if (!confirm('Cihazı silmek istediğinize emin misiniz?')) return;
            
            const device = devices.find(d => d.id === deviceId);
            const index = devices.findIndex(d => d.id === deviceId);
            
            if (index !== -1) {
                if (mqttClient && device.mac) {
                    const topics = [
                        `esp01/${device.mac}/r1/state`,
                        `esp01/${device.mac}/r2/state`,
                        `esp01/${device.mac}/status`
                    ];
                    topics.forEach(topic => mqttClient.unsubscribe(topic));
                    
                    // RSSI cache'den sil
                    delete rssiCache[device.mac];
                }
                
                devices.splice(index, 1);
                saveDevices();
                renderDevices();
                showAlert('Cihaz silindi', 'success');
            }
        }
        
        function log(message) {
            const logBox = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML = `<div class="log-entry"><span class="log-time">[${time}]</span> ${message}</div>` + logBox.innerHTML;
            
            if (logBox.childNodes.length > 100) {
                logBox.removeChild(logBox.lastChild);
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert ${type} show`;
            
            setTimeout(() => {
                alertDiv.className = 'alert';
            }, 3000);
        }
    </script>
</body>
</html>
